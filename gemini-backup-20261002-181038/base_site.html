{% extends 'admin/base.html' %}
{% block footer %}{{ block.super }}{% if user.is_active and user.is_staff %}
<style>
#cb-toggle{position:fixed;bottom:20px;right:20px;padding:15px 22px;border-radius:30px;background:#573622;color:white;border:1px solid #c79c67;z-index:1000;cursor:pointer}#cb-chat{position:fixed;bottom:85px;right:20px;width:min(380px,calc(100vw - 40px));background:var(--body-bg);color:var(--body-fg);border:1px solid var(--hairline-color);border-radius:14px;box-shadow:0 8px 35px #0004;z-index:1000;overflow:hidden}#cb-chat[hidden]{display:none}#cb-chat h2{background:#573622;color:white;padding:18px;margin:0}#cb-log{height:240px;overflow:auto;padding:15px;white-space:pre-wrap;overflow-wrap:anywhere}#cb-log p{padding:10px;background:var(--darkened-bg);border-radius:8px}#cb-form{padding:14px}#cb-question{box-sizing:border-box;width:100%;margin:8px 0;padding:10px}#cb-send{background:#573622;color:white;padding:10px 20px;border:0;border-radius:8px;cursor:pointer}#cb-hints{padding:0 14px;display:flex;gap:5px;flex-wrap:wrap}#cb-hints button{cursor:pointer;border-radius:12px;padding:7px;background:var(--darkened-bg);color:var(--body-fg);border:1px solid var(--hairline-color)}
</style>
<button id="cb-toggle" aria-expanded="false" aria-controls="cb-chat" type="button">✦ Admin assistant</button>
<section id="cb-chat" hidden aria-label="Admin assistant"><h2>Cocoa Bliss assistant</h2><div id="cb-log" role="log" aria-live="polite"><p>Hello! Live orders &amp; products information. Supports the questions below; no AI service connected.</p></div><div id="cb-hints"><button type="button">Total orders</button><button type="button">Today’s orders</button><button type="button">Pending orders</button><button type="button">List products</button></div><form id="cb-form" method="post" action="{% url 'admin-assistant' %}">{% csrf_token %}<label for="cb-question">Your question</label><input id="cb-question" name="question" required maxlength="500" autocomplete="off"><button id="cb-send">Send →</button></form></section>
<script>
(()=>{const t=document.getElementById('cb-toggle'),p=document.getElementById('cb-chat'),f=document.getElementById('cb-form'),q=document.getElementById('cb-question'),l=document.getElementById('cb-log'),s=document.getElementById('cb-send');let busy=false;t.onclick=()=>{p.hidden=!p.hidden;t.setAttribute('aria-expanded',String(!p.hidden));if(!p.hidden)q.focus()};p.onkeydown=e=>{if(e.key==='Escape'){p.hidden=true;t.setAttribute('aria-expanded','false');t.focus()}};function add(text){const el=document.createElement('p');el.textContent=text;l.appendChild(el);l.scrollTop=l.scrollHeight}document.querySelectorAll('#cb-hints button').forEach(b=>b.onclick=()=>{q.value=b.textContent;f.requestSubmit()});f.onsubmit=async e=>{e.preventDefault();if(busy||!q.value.trim())return;busy=true;s.disabled=true;add('You: '+q.value);try{const r=await fetch(f.action,{method:'POST',body:new FormData(f),credentials:'same-origin'});if(r.redirected)throw Error('Please sign in to admin again.');if(!(r.headers.get('content-type')||'').includes('application/json'))throw Error('Unable to answer. Refresh and try again.');add((await r.json()).answer);q.value=''}catch(e){add(e.message)}finally{busy=false;s.disabled=false;q.focus()}}})();
</script>
{% endif %}{% endblock %}
