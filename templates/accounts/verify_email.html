{% extends 'base.html' %}{% load static %}
{% block styles %}<link rel="stylesheet" href="{% static 'css/accounts.css' %}">{% endblock %}
{% block content %}<section class="auth"><h1>Verify your email</h1>
<p>Confirm your account email to continue. Your code expires in 10 minutes.</p>
{% if message %}<p role="status">{{ message }}</p>{% endif %}
<form method="post">{% csrf_token %}<button name="action" value="send">Send / resend code</button></form>
<form method="post">{% csrf_token %}<label for="email-code">Email verification code</label>
<input id="email-code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
<button name="action" value="verify">Verify email</button></form></section>{% endblock %}
