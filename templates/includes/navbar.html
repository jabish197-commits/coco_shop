{% load static %}<a class="skip" href="#main">Skip to content</a>
<header><a class="brand" href="{% url 'core:home' %}"><img src="{% static 'images/logo.svg' %}" alt="" width="36" height="36"> Cocoa Bliss</a>
<nav aria-label="Main navigation">
<a href="{% url 'shop:product_list' %}">Shop</a><a href="{% url 'shop:gift_boxes' %}">Gifts</a>
<a href="{% url 'shop:favourites' %}">Favourites <span aria-hidden="true">♡</span> (<span data-favourite-count>0</span>)</a>
<a href="{% url 'core:about' %}">Our story</a><a href="{% url 'cart:detail' %}">Bag ({{ cart|length }})</a>
{% if user.is_authenticated %}<a href="{% url 'orders:history' %}">My orders</a>
<form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button class="text-button">Log out</button></form>
{% else %}<a href="{% url 'accounts:login' %}">Log in</a><a href="{% url 'accounts:register' %}">Register</a>{% endif %}
</nav></header>
