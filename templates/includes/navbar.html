{% load static %}
<style>
header .icon-nav{gap:12px}header .nav-icon{position:relative;display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border:1px solid #e2cfb8;border-radius:14px;background:#fffaf2;color:#69452e;transition:background .18s,transform .18s,box-shadow .18s}header .nav-icon svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}header .nav-icon:hover,header .nav-icon:focus-visible{background:#ecd8bb;color:#382017;transform:translateY(-2px);box-shadow:0 5px 12px #38201714}header .nav-icon--heart{color:#a14c4c;background:#fcf0ea}header .nav-icon--gift{color:#98651c;background:#fcf2dc}header .nav-icon--orders{color:#59694e;background:#eff1e7}header .nav-count{position:absolute;right:-6px;top:-7px;min-width:20px;height:20px;padding:0 5px;display:flex;align-items:center;justify-content:center;background:#513323;color:#fff8ed;border:2px solid #faf4ea;border-radius:20px;font:600 10px/1 system-ui,sans-serif}header .nav-tooltip{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#382017;color:#fff9ef;padding:5px 9px;border-radius:6px;font-size:11px;opacity:0;pointer-events:none;z-index:20}header .nav-icon:hover .nav-tooltip,header .nav-icon:focus-visible .nav-tooltip{opacity:1}@media(max-width:480px){header .icon-nav{gap:10px}header .nav-icon{width:42px;height:42px}}@media(prefers-reduced-motion:reduce){header .nav-icon{transition:none;transform:none!important}}
header .nav-profile-name{display:inline-block;max-width:220px;overflow-wrap:anywhere;padding:10px 15px;border:1px solid #b58b59;border-radius:14px;font-weight:600;text-decoration:none;color:inherit}
</style>
<a class="skip" href="#main">Skip to content</a>
<header>
<a class="brand" href="{% url 'core:home' %}"><img src="{% static 'images/logo.svg' %}" alt="" width="36" height="36"> Cocoa Bliss</a>
<nav class="icon-nav" aria-label="Main navigation">
<button id="customer-theme-toggle" class="nav-icon" type="button" aria-label="Switch to dark mode" aria-pressed="false"><span data-theme-symbol aria-hidden="true" style="font-size:25px;line-height:1">☾</span></button>
<a class="nav-icon" href="{% url 'shop:product_list' %}" aria-label="Shop"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 10h18l-2-6H5l-2 6Z"/><path d="M4 10v10h16V10M9 20v-6h6v6M3 10c0 3 4 3 4 0 0 3 5 3 5 0 0 3 5 3 5 0 0 3 4 3 4 0"/></svg><span class="nav-tooltip">Shop</span></a>
<a class="nav-icon nav-icon--gift" href="{% url 'shop:gift_boxes' %}" aria-label="Gifts"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 8h18v4H3zM5 12v9h14v-9M12 8v13"/><path d="M12 8H8a3 3 0 1 1 3-3l1 3Zm0 0h4a3 3 0 1 0-3-3l-1 3Z"/></svg><span class="nav-tooltip">Gifts</span></a>
<a class="nav-icon nav-icon--heart" href="{% url 'shop:favourites' %}" aria-label="Favourites"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20.8 4.8a5.5 5.5 0 0 0-7.8 0L12 6l-1-1.2a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.4a5.5 5.5 0 0 0 0-7.8Z"/></svg><span class="nav-count" data-favourite-count>0</span><span class="nav-tooltip">Favourites</span></a>
<a class="nav-icon" href="{% url 'cart:detail' %}" aria-label="Bag, {{ cart|length }} items"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 7h14l1 14H4L5 7Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg><span class="nav-count" aria-hidden="true">{{ cart|length }}</span><span class="nav-tooltip">Your bag</span></a>
{% if user.is_staff %}<a class="nav-icon" href="{% url 'admin:index' %}" aria-label="Admin dashboard"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg><span class="nav-tooltip">Admin dashboard</span></a>{% endif %}
{% if user.is_authenticated %}
<a class="nav-profile-name" href="{% url 'accounts:profile' %}" aria-label="Profile for {{ user.username }}">{{ user.username }}</a>
<a class="nav-icon nav-icon--orders" href="{% url 'orders:history' %}" aria-label="My orders"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 3h14v19l-3-2-4 2-4-2-3 2V3Z"/><path d="M9 7h6M9 11h6M9 15h3"/></svg><span class="nav-tooltip">My orders</span></a>
<form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button class="text-button">Log out</button></form>
{% else %}<a href="{% url 'accounts:login' %}">Log in</a><a href="{% url 'accounts:register' %}">Register</a>{% endif %}
</nav></header>
