{% load static %}<article class="product-card">
<button type="button" class="favourite-button" data-product-id="{{ product.pk }}" data-product-name="{{ product.name }}" aria-label="Add {{ product.name }} to favourites" aria-pressed="false" hidden>
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg>
</button>
<a href="{{ product.get_absolute_url }}">
{% with picture=product.images.first %}{% if picture %}<img src="{{ picture.image.url }}" alt="{{ picture.alt_text }}" loading="lazy">{% else %}<img src="{% static 'images/hero-chocolate.webp' %}" alt="Chocolate illustration" loading="lazy">{% endif %}{% endwith %}
<h2>{{ product.name }}</h2></a><p>₹ {{ product.price }}</p></article>
