<div class="checkout-field">
  {{ field.label_tag }}
  {{ field }}
  {% if field.errors %}<div id="{{ field.id_for_label }}_errors" class="field-errors">{{ field.errors }}</div>{% endif %}
  {% if field.help_text %}<small class="helptext" id="{{ field.id_for_label }}_helptext">{{ field.help_text }}</small>{% endif %}
</div>
